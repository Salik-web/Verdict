# Monitor (visibility measurement) stage configuration.
#
# Data-driven per principle 3: engines, repeat count, and prompt-generation
# target all live here, never inline in code. Adding an engine (Perplexity
# Sonar / OpenAI / Gemini) is a new entry here + a gateway task in models.yaml —
# not a code change.

# How many times each prompt is asked per engine (smooths run-to-run variance).
repeats: 5

# Prompt auto-generation target (~25-30 high-intent prompts).
prompt_target_count: 28

# Fallback business category when the account has none in settings.category.
default_category: "B2B SaaS product analytics"

# Engines measured in a scan. Start with one; more are added here.
#
# `name` is an internal SLOT id (used to cycle mock scenarios and match a scan's
# requested engines) — it is NOT the label stored in the DB. The stored engine
# label is derived from the model that actually answered (e.g. gemini/
# gemini-2.5-flash in dev, mock/sonar in mock), so the DB never misattributes.
# Hence a neutral slot name here rather than a provider name.
# Each engine is independently enable/disable-able BY WHETHER ITS KEY IS PRESENT.
# An engine whose provider key is missing is dropped before any call is made and
# reported as unavailable, so a user holding only one key gets a working
# one-engine scan rather than an error (see app/gateway/availability.py).
engines:
  - name: primary
    gateway_task: measurement
    # MOCK-ONLY: scenarios cycled by run index so repeated runs vary, which
    # exercises share-of-voice smoothing. Omitted/ignored in dev & prod (there
    # the engine is queried for real, N times).
    mock_scenarios:
      - competitor_wins
      - competitor_wins
      - competitor_wins
      - customer_invisible
      - customer_invisible
  # Additional engines. Uncomment any you hold a key for — they cost nothing to
  # leave enabled without one, because an engine with no key is skipped rather
  # than failing the scan. Each ADDS (prompts x repeats) grounded calls, so
  # enabling all four multiplies your per-scan spend by four.
  #
  # Only Gemini has been verified against a live API. See docs/ENGINES.md for
  # per-engine cost, free-tier reality, and verification status.
  # - name: perplexity
  #   gateway_task: measurement_perplexity
  # - name: openai
  #   gateway_task: measurement_openai
  # - name: anthropic
  #   gateway_task: measurement_anthropic
