# Model gateway configuration — the SINGLE place that maps tasks to models.
#
# Nothing in the codebase hardcodes a model or provider. Changing a model, a
# provider, or a whole mode is an edit HERE, never a code change.
#
# Mode is chosen by env GATEWAY_MODE (mock | dev | prod); default is `mock`,
# below. Each task has an entry per mode.
#   mock -> canned fixture responses, no network, NO API key (default)
#   dev  -> free providers (Groq / OpenRouter / Google AI Studio / Ollama)
#   prod -> the paid production models
#
# Pricing is USD per 1,000,000 tokens and drives llm_cost_log. Mock entries are
# priced to mirror their prod equivalent so cost rows look realistic (the
# llm_cost_log.mock flag marks them as simulated).

default_mode: mock

# ── Task → model, per mode ───────────────────────────────────────────────
tasks:
  measurement: # ask the real AI engines what they recommend
    prod:
      provider: perplexity
      model: sonar
    dev:
      # Gemini direct via Google AI Studio, WITH Google Search grounding.
      # Grounding is the whole point for measurement: an ungrounded answer is
      # training-data recall and cites nothing, so we'd be measuring the wrong
      # thing and Diagnosis would get no cited_urls.
      # Grounding free allowance is per model generation — 2.5 gets 1,500
      # grounded requests/day free vs Gemini 3's 5,000/month, so 2.5-flash is the
      # better iteration target. See ai.google.dev/gemini-api/docs/pricing.
      provider: gemini
      model: gemini-2.5-flash
      grounding: true
    mock:
      provider: mock
      model: sonar
      fixture_dir: measurement
      default_scenario: competitor_wins
  # A SECOND measurement engine, selected per-engine in config/monitor.yaml.
  # Perplexity Sonar is grounded by default — there is no ungrounded mode to get
  # wrong — and it returns `search_results` with publisher titles, which is what
  # makes third-party-presence checking possible without extra HTTP.
  measurement_perplexity:
    prod:
      provider: perplexity
      model: sonar
      grounding: true
    dev:
      provider: perplexity
      model: sonar
      grounding: true
    mock:
      provider: mock
      model: sonar
      fixture_dir: measurement
      default_scenario: competitor_wins

  # OpenAI, GROUNDED via the Responses API + hosted web_search tool. Note the
  # provider is `openai_responses`, not `openai`: grounded OpenAI is a different
  # ENDPOINT, not a flag. Ungrounded OpenAI is deliberately not offered as a
  # measurement engine — it measures training recall and cites nothing.
  measurement_openai:
    prod:
      provider: openai_responses
      model: gpt-4.1
      grounding: true
    dev:
      provider: openai_responses
      model: gpt-4.1-mini
      grounding: true
    mock:
      provider: mock
      model: sonar
      fixture_dir: measurement
      default_scenario: competitor_wins

  # Anthropic, GROUNDED via the Messages API web_search tool. Billed per SEARCH,
  # and one request may run several, so max_searches caps the spend per call.
  measurement_anthropic:
    prod:
      provider: anthropic
      model: claude-sonnet-5
      grounding: true
      max_searches: 5
    dev:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      grounding: true
      max_searches: 3
    mock:
      provider: mock
      model: sonar
      fixture_dir: measurement
      default_scenario: competitor_wins

  processing: # cheap, high-volume parsing/extraction
    prod:
      provider: deepseek
      model: deepseek-v4-flash
      json_output: true
    dev:
      # WAS groq/llama-3.1-8b-instant. Measured on 10 stored answers from scan
      # 4ca73df6: llama-8b recalled ~40% of the brands the engines actually named
      # and returned NOTHING from one 2,968-character answer — share of voice was
      # being computed on under half the market. Extraction is a reading-
      # comprehension task, and an 8B model is not good enough at it.
      #
      # Cost is not the constraint: measurement is 99.8% of a scan's spend
      # ($0.3627 of $0.3634) because grounded requests are billed flat at $0.035.
      # Even a 100x more expensive parser moves a scan from $0.363 to ~$0.43.
      # thinking_budget: 0 — extraction needs no reasoning, and thinking tokens are
      # what make Gemini return empty candidates (see providers/gemini.py).
      #
      # Measured on the same 8 non-empty stored answers (129 brand-mentions):
      #   groq/llama-3.1-8b-instant   41/129 =  31.8%   <- was shipping
      #   gemini/gemini-3.1-flash-lite 125/129 = 96.9%
      #
      # flash-LITE, not flash: gemini-2.5-flash's free tier is capped at 20
      # requests/DAY/project/model, and measurement alone burns 10 of those per
      # scan — putting processing on the same model would cap the product at one
      # scan a day. flash-lite is a different quota bucket AND scored 96.9%, so
      # there is nothing to trade off. It also accepts thinkingBudget (3.5-lite
      # only accepts thinkingLevel), which keeps the knob below honest.
      provider: gemini
      model: gemini-3.1-flash-lite
      json_output: true # we parse this into ParsedMention
      thinking_budget: 0
    mock:
      provider: mock
      model: deepseek-v4-flash
      fixture_dir: processing
      default_scenario: mention_extract
  generation: # content generation
    prod:
      provider: kimi
      model: kimi-k2.7
      json_output: true
    dev:
      # Free OpenRouter slugs churn — the old deepseek-chat-v3:free was removed
      # (404). Verify a current one at https://openrouter.ai/models?q=free and
      # ping it before committing. This one was confirmed to resolve + honor JSON
      # mode + return parseable JSON on 2026-07-22.
      provider: openrouter
      model: "openai/gpt-oss-20b:free"
      json_output: true # we parse this into an AssetDraft
    mock:
      provider: mock
      model: kimi-k2.7
      fixture_dir: generation
      default_scenario: comparison_page

# Optional per-task, per-mode fallback used if the primary provider fails.
fallbacks:
  generation:
    prod:
      provider: deepseek
      model: deepseek-v4

# ── Providers ────────────────────────────────────────────────────────────
# type: mock | openai_compatible | gemini  (gemini adapter lands with keys)
#
# rpm            = token-bucket ceiling (allows a burst up to rpm, then throttles)
# min_interval_s = hard SPACING between consecutive calls to that provider.
#   Free tiers punish bursts, and the bucket starts full — so rpm alone lets the
#   first `rpm` calls fire instantly and trip a 429. Spacing is what keeps a free
#   tier happy; set it to ~60/rpm (or higher) for free providers.
providers:
  mock:
    type: mock
  perplexity:
    type: openai_compatible
    base_url: https://api.perplexity.ai
    api_key_env: PERPLEXITY_API_KEY
    rpm: 50
  openai:
    type: openai_compatible
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    rpm: 500
  gemini:
    type: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GOOGLE_API_KEY
    # Google no longer publishes per-model free-tier RPM/RPD in the docs — it's
    # per-project and shown in AI Studio (aistudio.google.com/rate-limit).
    # These are conservative: widely-reported free-tier 2.5-flash is ~10 RPM, so
    # 7s spacing keeps us under it with margin. RAISE min_interval_s if you see
    # 429s; check your own dashboard for the real numbers.
    rpm: 10
    min_interval_s: 7.0
  openai_responses:
    type: openai_responses
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    rpm: 60
    min_interval_s: 1.0
  anthropic:
    type: anthropic
    base_url: https://api.anthropic.com/v1
    api_key_env: ANTHROPIC_API_KEY
    rpm: 50
    min_interval_s: 1.2
  deepseek:
    type: openai_compatible
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    rpm: 100
  kimi:
    type: openai_compatible
    base_url: https://api.moonshot.cn/v1
    api_key_env: MOONSHOT_API_KEY
    rpm: 60
  groq:
    type: openai_compatible
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    rpm: 30
    min_interval_s: 2.0 # free tier: ~30 rpm -> 2s apart
  openrouter:
    type: openai_compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    rpm: 20
    # Free tier is ~20 req/min AND a small daily cap on `:free` models.
    # 4s spacing stays well under the per-minute limit.
    min_interval_s: 4.0

# ── Pricing (USD per 1,000,000 tokens) ───────────────────────────────────
pricing:
  # docs.perplexity.ai/getting-started/pricing (checked 2026-08-15):
  #   sonar = $1/1M input, $1/1M output, PLUS a per-request fee that varies with
  #   search context size — $5 / $8 / $12 per 1,000 requests for low / medium /
  #   high. Web search is bundled into that request fee; there is no separate
  #   per-search-query charge for plain `sonar` (Deep Research is the exception,
  #   at $5/1,000 searches).
  #
  # This is materially cheaper than Gemini 2.5's $35/1,000 grounded prompts:
  # roughly 3-7x less per grounded request, depending on context size.
  #
  # CAVEAT, and it is worth one live call to close: we do not currently send
  # `web_search_options.search_context_size`, so the effective tier is
  # Perplexity's default rather than one we chose. The response echoes
  # `search_context_size` back in `usage`, so a single real request confirms
  # which tier to price at. Priced at MEDIUM here as the middle estimate.
  "perplexity/sonar":
    input: 1.00
    output: 1.00
    grounded_request: 0.008
  "deepseek/deepseek-v4-flash":
    input: 0.07
    output: 0.27
  "deepseek/deepseek-v4":
    input: 0.27
    output: 1.10
  "kimi/kimi-k2.7":
    input: 0.60
    output: 2.50
  # Mock models reuse the prod price so simulated cost rows look real.
  "mock/sonar":
    input: 1.00
    output: 1.00
  "mock/deepseek-v4-flash":
    input: 0.07
    output: 0.27
  "mock/kimi-k2.7":
    input: 0.60
    output: 2.50
  # ── dev models, priced at their REAL PAID RATES ────────────────────────
  # These run on free tiers, so the actual bill is $0 — but pricing them at 0.0
  # made cost_usd useless for judging unit economics. Priced at list rates,
  # cost_usd answers "what would this scan cost if we were paying?" while the run
  # itself stays free. llm_cost_log therefore reports MODELLED cost, not the
  # amount charged; `mock` marks simulated calls, but there is no "was free-tier"
  # flag — see SCALING.md/README before quoting these numbers as spend.
  "groq/llama-3.1-8b-instant": # groq.com/pricing
    input: 0.05
    output: 0.08
  "groq/llama-3.3-70b-versatile": # groq.com/pricing
    input: 0.59
    output: 0.79
  # The `:free` slug costs nothing; priced here at the PAID openai/gpt-oss-20b
  # rate (OpenRouter list price, per their /models API on 2026-07-22) so the
  # modelled economics are honest.
  "openrouter/openai/gpt-oss-20b:free":
    input: 0.03
    output: 0.13
  # OpenAI hosted web_search: $10.00 / 1,000 CALLS, and search content is billed
  # at the model's standard INPUT rate (developers.openai.com/api/docs/pricing,
  # checked 2026-08-16). Exception noted there: gpt-4o-mini / gpt-4.1-mini on the
  # non-preview tool bill search content as a flat 8,000 input tokens per call.
  # Token rates below are the published list rates for these models.
  "openai_responses/gpt-4.1":
    input: 2.00
    output: 8.00
    grounded_request: 0.01
  "openai_responses/gpt-4.1-mini":
    input: 0.40
    output: 1.60
    grounded_request: 0.01
  # Anthropic web search: $10 per 1,000 SEARCHES plus standard token costs, and
  # search results count as input tokens
  # (platform.claude.com/docs/en/agents-and-tools/tool-use/web-search-tool,
  # checked 2026-08-16). Billed PER SEARCH, not per request — one request can run
  # several, which is why grounded_units exists. A failed search is not billed.
  "anthropic/claude-sonnet-5":
    input: 3.00
    output: 15.00
    grounded_request: 0.01
  "anthropic/claude-haiku-4-5-20251001":
    input: 1.00
    output: 5.00
    grounded_request: 0.01
  # Gemini 2.5 Flash: $0.30/1M in, $2.50/1M out (output includes thinking tokens).
  # grounded_request = $35 / 1,000 grounded prompts = $0.035 each, charged ONLY on
  # grounded calls (measurement). The first 1,500 grounded prompts/day are free,
  # which this flat rate deliberately ignores — it models the marginal paid cost.
  # ai.google.dev/gemini-api/docs/pricing
  "gemini/gemini-2.5-flash":
    input: 0.30
    output: 2.50
    grounded_request: 0.035
  # Gemini 3.1 Flash-Lite (ai.google.dev/gemini-api/docs/pricing, checked
  # 2026-07-28): $0.25/1M in, $1.50/1M out, text. Ungrounded — the parser reads an
  # answer we already paid to fetch, so no grounded_request fee applies.
  "gemini/gemini-3.1-flash-lite":
    input: 0.25
    output: 1.50

# ── Cross-cutting defaults ───────────────────────────────────────────────
# Retries apply to 429 / 5xx / transport errors (mock never reaches the network).
# Tuned for free tiers: back off in seconds, not milliseconds, and honour the
# provider's Retry-After when it sends one. After max_attempts the call FAILS —
# a persistent 429 (e.g. a daily cap) must surface, not spin.
retry:
  max_attempts: 3
  initial_backoff_s: 2.0
  max_backoff_s: 30.0
  respect_retry_after: true
  # Cap on an honoured Retry-After; a provider asking for 10 minutes should fail
  # the scan with a clear error rather than block a worker that long.
  max_retry_after_s: 60.0

cache:
  enabled: true
  ttl_s: 3600
