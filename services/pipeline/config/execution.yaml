# Execution stage settings.

# Where generated asset files are written (relative to services/pipeline).
# content_ref on each asset points at the file; delivery = store + downloadable.
artifacts_dir: "artifacts"

# fix_type -> asset.type label recorded on the assets row. New fix types add a
# generator (sharing the Generator interface) and a line here.
asset_types:
  generate_comparison_page: comparison_page
  fix_robots_txt: robots_txt
  add_llms_txt: llms_txt
