[project]
name = "geo-pipeline"
version = "0.1.0"
description = "GEO SaaS Python ML pipeline (FastAPI + Celery + LangGraph)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "celery[redis]>=5.4.0",
    "langgraph>=0.2.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.0",
    "tenacity>=9.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "black>=24.10.0",
    "pytest>=8.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
