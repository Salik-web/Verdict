# Local dev infra for the GEO SaaS: Postgres 16 (+pgvector) and Redis.
# Usage:
#   cd infra
#   cp .env.example .env
#   docker compose up -d
#
# This only starts empty Postgres + Redis. Apply the schema with the migration
# runner (the SQL files in ../db/migrations are the source of truth):
#   pnpm --filter @geo/api db:migrate
#   pnpm --filter @geo/api db:seed

name: geo

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geo}
      POSTGRES_DB: ${POSTGRES_DB:-geo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-geo} -d ${POSTGRES_DB:-geo}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
