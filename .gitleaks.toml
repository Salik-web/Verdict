# gitleaks configuration for the GEO SaaS monorepo.
# Run locally:   gitleaks detect --config .gitleaks.toml --redact
# Run on staged: gitleaks protect --staged --config .gitleaks.toml --redact
#
# Extends the upstream default ruleset (covers AWS keys, generic API keys,
# private keys, JWTs, OpenAI/Anthropic-style tokens, etc.) and layers on a
# couple of project-specific rules + allowlists.

[extend]
useDefault = true

[[rules]]
id = "internal-shared-secret"
description = "Internal service-to-service shared secret committed to the repo"
# Matches assignments like INTERNAL_SHARED_SECRET=... with a non-placeholder value.
regex = '''(?i)internal_shared_secret\s*[:=]\s*['"]?[A-Za-z0-9/+_\-]{12,}['"]?'''
keywords = ["internal_shared_secret"]

[allowlist]
description = "Global allowlist for placeholders, examples, and lockfiles"
paths = [
  '''.*\.env\.example$''',
  '''pnpm-lock\.yaml$''',
  '''uv\.lock$''',
  '''\.gitleaks\.toml$''',
]
# Placeholder values used throughout .env.example files and docs.
regexes = [
  '''(?i)(changeme|placeholder|example|your[-_]?[a-z]+[-_]?here|<[^>]+>|xxx+|dummy)''',
  '''postgres://geo:geo@''',
  # FILL_ME is the explicit "you must replace this" marker in the seed configs;
  # scripts/create-real-account.mjs refuses to run while any remains.
  '''FILL_ME''',
  # Deterministic, non-secret values baked into CI and the test suite. They are
  # not credentials to anything: the CI database is ephemeral and destroyed with
  # the runner, and the test constants only satisfy a required-env check.
  '''ci-[a-z]+-secret-\d+''',
  '''test-secret-\d+''',
  # argon2 hashes appear in TEST fixtures only. The demo account's hash used to
  # be committed in db/seed.sql alongside its plaintext in a comment; it is now
  # generated at seed time and printed once, so no real credential is committed.
  # This entry stays because test files still construct hash-shaped strings.
  '''\$argon2id\$v=19\$m=\d+,t=\d+,p=\d+\$[A-Za-z0-9+/]+\$[A-Za-z0-9+/]+''',
  # The development placeholders shipped in docker-compose.yml so
  # `docker compose up` needs no setup. They are deliberately public — this
  # repository publishes them — and they protect nothing: the API REFUSES to
  # boot on them when NODE_ENV=production (apps/api/src/config.ts). Allowlisted
  # by VALUE rather than by excluding the whole file, so a real secret
  # accidentally added to docker-compose.yml would still be caught.
  '''dev-only-change-me-[0-9a-f]+''',
  # An all-zero KEK is the "obviously not a real key" placeholder, and the same
  # production guard rejects it.
  '''MASTER_ENCRYPTION_KEY[:=]\s*0{64}''',
  # Fake secrets constructed by the production-guard test itself
  # (apps/api/src/tests/config.test.ts). They exist to prove the guard fires;
  # they are not credentials to anything.
  '''a-real-generated-(secret|cookie-secret)-\d+''',
  '''my-own-secret-value-[0-9a-z]+''',
]
